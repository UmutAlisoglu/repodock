name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repodock and PyInstaller
        run: python -m pip install . pyinstaller

      - name: Build repodock.exe
        run: >
          pyinstaller --noconfirm --onedir --name repodock --console
          --icon packaging/windows/repodock.ico packaging/windows/entry.py

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $exe = "dist\repodock\repodock.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $exe detect .
          if ($LASTEXITCODE -ne 0) { throw "detect failed" }
          $env:REPODOCK_DIR = "$env:RUNNER_TEMP\repodock-home"
          $p = Start-Process -FilePath $exe -ArgumentList "--no-open","--port","8799" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:8799/api/state"
              $ok = $true; break
            } catch { }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "the dashboard did not answer" }
          "dashboard answered"

      - name: Build the installer
        shell: pwsh
        run: |
          $version = python -c "import repodock; print(repodock.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" packaging\windows\repodock.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path dist\repodock\* -DestinationPath dist\repodock-windows-portable.zip

      - name: Test the installer
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\repodock-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $installed = "$env:LOCALAPPDATA\Programs\repodock\repodock.exe"
          & $installed --version
          if ($LASTEXITCODE -ne 0) { throw "installed exe failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: repodock-windows
          path: |
            dist/repodock-setup.exe
            dist/repodock-windows-portable.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/repodock-setup.exe dist/repodock-windows-portable.zip --clobber
