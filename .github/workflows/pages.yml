name: Website

# The repodock page and the "Run with repodock" badge page, on GitHub Pages:
# https://umutalisoglu.github.io/repodock/

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/*.gif", "docs/*.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the site together
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/demo.gif docs/dashboard.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
