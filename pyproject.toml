[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repodock"
dynamic = ["version"]
description = "Paste a GitHub link, download the repo and run it from a local dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Druomi" }]
requires-python = ">=3.9"
keywords = ["github", "launcher", "dashboard", "clone", "runner", "self-hosted"]
classifiers = [
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/UmutAlisoglu/repodock"

[project.scripts]
repodock = "repodock.cli:main"

[tool.setuptools.dynamic]
version = { attr = "repodock.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
