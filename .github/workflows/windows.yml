name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repodock with the app window, and PyInstaller
        run: python -m pip install ".[app]" pyinstaller

      - name: Build repodock.exe and repodock-cli.exe
        run: pyinstaller --noconfirm packaging/windows/repodock.spec

      - name: Test the command line
        shell: pwsh
        run: |
          $cli = "dist\repodock\repodock-cli.exe"
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $cli detect .
          if ($LASTEXITCODE -ne 0) { throw "detect failed" }
          $env:REPODOCK_DIR = "$env:RUNNER_TEMP\repodock-browser"
          $p = Start-Process -FilePath $cli -ArgumentList "--browser","--no-open","--port","8799" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $state = Invoke-RestMethod -Uri "http://127.0.0.1:8799/api/state"; $ok = $true; break } catch { }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "the dashboard did not answer" }
          "browser mode answered, version $($state.version)"

      - name: Test the app window
        shell: pwsh
        run: |
          $env:REPODOCK_DIR = "$env:RUNNER_TEMP\repodock-app"
          $app = Start-Process -FilePath "dist\repodock\repodock.exe" -ArgumentList "--minimized" -PassThru
          $instance = "$env:REPODOCK_DIR\.repodock\instance.json"
          $port = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            if (Test-Path $instance) {
              $port = (Get-Content $instance | ConvertFrom-Json).port
              try { $state = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state"; if ($state.app.mode -eq "window") { break } } catch { }
            }
            if ($app.HasExited) { Get-Content "$env:LOCALAPPDATA\repodock\repodock.log" -ErrorAction SilentlyContinue; throw "repodock.exe exited early" }
          }
          if (-not $port) { throw "repodock.exe did not start" }
          "mode: $($state.app.mode), tray: $($state.app.tray)"
          if ($state.app.mode -ne "window") { Get-Content "$env:LOCALAPPDATA\repodock\repodock.log" -ErrorAction SilentlyContinue; throw "the app window did not open" }
          # Starting it again shows the running one instead of a second copy.
          $out = & "dist\repodock\repodock-cli.exe" 2>&1 | Out-String
          $out
          if ($out -notmatch "already running") { throw "a second repodock started" }
          # A repodock:// link reaches the running one, which asks on the page whether to add the project.
          & "dist\repodock\repodock-cli.exe" "repodock://UmutAlisoglu/repodock" 2>&1 | Out-String
          $state = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state"
          if ($state.link_request.repo -ne "UmutAlisoglu/repodock") { throw "the repodock:// link didn't arrive" }
          "link arrived: $($state.link_request.repo)"
          # Quit from the page's Settings > Quit.
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/quit" -Headers @{ "X-Repodock" = "1" } -ContentType "application/json" -Body "{}"
          if (-not $app.WaitForExit(20000)) { Stop-Process -Id $app.Id -Force; throw "repodock.exe did not quit" }
          if (Test-Path $instance) { throw "instance file was left behind" }
          "app window opened and quit cleanly"

      - name: Build the installer
        shell: pwsh
        run: |
          $version = python -c "import repodock; print(repodock.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" packaging\windows\repodock.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path dist\repodock\* -DestinationPath dist\repodock-windows-portable.zip

      - name: Test the installer
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\repodock-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $installed = "$env:LOCALAPPDATA\Programs\repodock"
          & "$installed\repodock-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed exe failed" }
          if (-not (Test-Path "$installed\repodock.exe")) { throw "repodock.exe missing" }
          $handler = (Get-ItemProperty "HKCU:\Software\Classes\repodock\shell\open\command")."(default)"
          "repodock:// opens: $handler"
          if ($handler -notmatch "repodock.exe") { throw "repodock:// links aren't registered" }

      - uses: actions/upload-artifact@v4
        with:
          name: repodock-windows
          path: |
            dist/repodock-setup.exe
            dist/repodock-windows-portable.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/repodock-setup.exe dist/repodock-windows-portable.zip --clobber

      - name: Write the winget and Scoop manifests
        if: github.event_name == 'release' && !github.event.release.prerelease
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python packaging/manifests.py "${{ github.event.release.tag_name }}" dist/repodock-setup.exe dist/repodock-windows-portable.zip packaging/winget
          if ($LASTEXITCODE -ne 0) { throw "manifests.py failed" }
          # The Scoop bucket lives in this repository: scoop bucket add repodock https://github.com/UmutAlisoglu/repodock
          # The winget manifests are kept next to it, ready for: wingetcreate submit <folder>
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/repodock.json packaging/winget
          git commit -m "winget and Scoop manifests for repodock ${{ github.event.release.tag_name }}"
          git push origin main

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release' && !github.event.release.prerelease
        with:
          name: store-manifests
          path: |
            packaging/winget
            bucket/repodock.json
